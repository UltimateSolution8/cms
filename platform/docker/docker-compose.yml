# Local development stack.
#
# Nothing here is production configuration. Passwords are in the file, TLS is off, and the data
# volume is disposable. What it does reproduce faithfully is the *role separation* the append-only
# guarantee depends on: migrations run as an owner role, the application connects as a separate
# role whose UPDATE and DELETE privileges on the evidence tables have been revoked. A developer
# machine where everything runs as the owner would silently lose that layer, and the first anyone
# would hear of it is in a production incident.
#
#   docker compose -f platform/docker/docker-compose.yml up -d
#   cd platform && mvn spring-boot:run -pl consent-service -Dspring-boot.run.profiles=local

name: uds-consent

services:

  postgres:
    # 17 to match the hosted database (Supabase runs 17.6), so a developer is not the only person
    # ever to exercise the schema on 16. Nothing in the migration tree is version-sensitive — no
    # extensions, partitioning is 13+, advisory locks and `for update skip locked` are stable — and
    # that was a premise until the suite ran against 17 and made it a measurement.
    #
    # Bumping this on a machine that already has a 16 data directory will not start: PostgreSQL
    # refuses a data dir written by a different major version. `docker compose down -v` first. The
    # volume is a development database and is droppable by definition; anything in it that is not
    # is a bar this project has already decided nobody crosses.
    image: postgres:17-alpine
    container_name: uds-consent-postgres
    environment:
      POSTGRES_DB: uds_consent
      POSTGRES_USER: uds_consent_owner
      POSTGRES_PASSWORD: uds_consent_owner
      # Deterministic collation, so that ordering in a developer's database matches the server's.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # 5433 on the host, not 5432. A developer machine very often already has a PostgreSQL
      # running on the default port — a Homebrew install, another project's container — and
      # the failure when it does is a port-bind error at `up` if you are lucky, or the
      # application quietly migrating someone else's database if you are not. Override with
      # POSTGRES_PORT if 5433 is taken too.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uds_consent_owner -d uds_consent"]
      interval: 5s
      timeout: 3s
      retries: 20
    command:
      - postgres
      # Log every statement that takes longer than a tenth of a second. The decision API's budget
      # is 30ms end to end, so anything at this threshold is worth seeing while it is still cheap
      # to fix.
      - -c
      - log_min_duration_statement=100

  # An identity provider for development and for the by-hand walkthrough. Behind a profile, so
  # nothing starts it by default:  docker compose --profile auth up -d keycloak
  #
  # The platform's own JWT behaviour is covered by JwtAuthenticationIT, which mints tokens
  # in-process against a generated key pair and needs no container. What has never been exercised
  # by anything is the *discovery* path — issuer-uri to openid-configuration to JWKS, then the iss
  # and aud validators against a token an issuer actually signed. That is what this is for, and
  # what KeycloakIssuerIT asserts.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: uds-consent-keycloak
    profiles: ["auth"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      # 8081, because 8080 is the application. A developer who binds the identity provider to the
      # port the platform serves on gets a token endpoint that answers and an API that does not,
      # which is a confusing five minutes.
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/uds-realm.json:/opt/keycloak/data/import/uds-realm.json:ro
      # A second realm that exists only so a token from a DIFFERENT issuer can be
      # produced. It claims the same audience deliberately, so refusing it proves
      # JwtIssuerValidator rather than the audience check standing in for it.
      - ./keycloak/other-realm.json:/opt/keycloak/data/import/other-realm.json:ro
    healthcheck:
      # Keycloak 26 ships no curl and no wget, and its management endpoints are on a second
      # port. This goes through the JVM's own client and probes the REALM rather than the
      # server, because a realm import that fails leaves the server perfectly healthy and the
      # realm absent — which is the failure that would otherwise be discovered by a token
      # request three minutes later.
      test:
        - CMD
        - /opt/keycloak/bin/kcadm.sh
        - config
        - credentials
        - --server
        - http://localhost:8080
        - --realm
        - master
        - --user
        - admin
        - --password
        - admin
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # Kafka-compatible broker for the outbox relay. Optional: the service defaults to the logging
  # publisher and needs no broker at all until a downstream system depends on hearing about
  # withdrawals. Start it with `--profile events`.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: uds-consent-redpanda
    profiles: ["events"]
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  # The service itself. Under a profile so that `up -d` gives a database and nothing else,
  # which is what you want while running the application from an IDE. Start the whole stack
  # with `--profile app`.
  consent-service:
    build:
      context: ..
      dockerfile: consent-service/Dockerfile
    container_name: uds-consent-service
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/uds_consent
      DB_USER: uds_consent_app
      DB_PASSWORD: uds_consent_app
      DB_MIGRATION_URL: jdbc:postgresql://postgres:5432/uds_consent
      DB_MIGRATION_USER: uds_consent_owner
      DB_MIGRATION_PASSWORD: uds_consent_owner
      # Passed through rather than defaulted here, so that bringing the stack up the way an
      # operator would — with a real pepper and a real key pair in the environment — exercises the
      # same path a deployment uses. Unset, the `local` profile's development pepper applies and
      # the service generates an ephemeral signing key and warns about both, which is correct for
      # a laptop and is not what a walkthrough should be proving.
      IDENTIFIER_PEPPER: ${IDENTIFIER_PEPPER:-}
      SNAPSHOT_KEY_ID: ${SNAPSHOT_KEY_ID:-dev-ephemeral}
      SNAPSHOT_SIGNING_KEY: ${SNAPSHOT_SIGNING_KEY:-}
      SNAPSHOT_VERIFICATION_KEY: ${SNAPSHOT_VERIFICATION_KEY:-}
    ports:
      - "${SERVICE_PORT:-8080}:8080"
      # The actuator, on its own port. Published here because a laptop is where somebody first
      # looks at /actuator/prometheus and /actuator/health/readiness; in the cluster this port is
      # reachable from the scraper and the kubelet and from nothing else. See deploy/k8s.
      - "${MANAGEMENT_PORT:-9090}:9090"

volumes:
  postgres-data:
