# =====================================================================================
# What has to be injected, and what must never be committed.
#
# THIS FILE IS AN EXAMPLE. It contains no real values and none of the placeholders below will
# start the platform — which is deliberate: the service refuses to start without a pepper and
# refuses to start with a weak one, so a copy-paste of this file fails loudly at boot rather
# than quietly producing a database of recoverable phone numbers.
#
# In a real cluster these come from the group's secret manager through External Secrets or
# equivalent. The manifests reference them by name only, so the mechanism can change without
# touching deployment.yaml.
# =====================================================================================
apiVersion: v1
kind: Secret
metadata:
  name: uds-consent-db
type: Opaque
stringData:
  url: "jdbc:postgresql://postgresql:5432/uds_consent"

  # TWO ROLES, AND THIS IS NOT A STYLE PREFERENCE.
  #
  # Flyway migrates as the owner. The service connects as an application role whose UPDATE and
  # DELETE on the evidence tables V2 has revoked, and which the row-level security policies bind
  # — V13 deliberately does not FORCE RLS, so policies never apply to a table's owner.
  #
  # Point both at the same user and two independent controls vanish at once: the application
  # regains the ability to edit history, and every isolation policy is bypassed. The platform
  # looks exactly as it does when everything is correct. RowLevelSecurityIT asserts the
  # separation in CI; OPERATIONS.md §8 asks an operator to verify it once by hand.
  app-user: "uds_consent_app"
  app-password: "REPLACE-FROM-SECRET-MANAGER"
  owner-user: "uds_consent_owner"
  owner-password: "REPLACE-FROM-SECRET-MANAGER"
---
apiVersion: v1
kind: Secret
metadata:
  name: uds-consent-crypto
type: Opaque
stringData:
  # Mixed into every identifier hash before it reaches the ledger. The space of Indian mobile
  # numbers is about 10^10 candidates — minutes of GPU time — so a bare hash of a phone number
  # is reversible in practice and the pepper is the only thing that is not.
  #
  # Minimum 32 characters, enforced at start-up. Generate it; do not compose it from words.
  # Rotating it invalidates every stored hash and requires a planned re-hash of
  # subject_identifier and suppression_entry, so treat it as versioned alongside the ledger and
  # do not put it on a calendar.
  identifier-pepper: "REPLACE-openssl rand -base64 48"

  # Ed25519, both halves together. The JDK's private key encoding does not carry the public
  # point, and deriving it would mean hand-rolling scalar multiplication in the component the
  # entire offline enforcement story rests on.
  #
  # Changing snapshot-key-id is the first step of a rotation, not a rename. Read OPERATIONS.md
  # §2.2 first: retire the outgoing key only after every replica is on the new one, or the
  # replicas still signing with it produce snapshots no device will accept.
  snapshot-key-id: "uds-snapshot-2026-08"
  snapshot-signing-key: "REPLACE-base64 PKCS#8 Ed25519 private key"
  snapshot-verification-key: "REPLACE-base64 X.509 Ed25519 public key"
---
apiVersion: v1
kind: Secret
metadata:
  name: uds-consent-clients
type: Opaque
stringData:
  # HTTP Basic per client, and honestly interim. The role model — CAPTURE writes consent,
  # DECISION asks and cannot write, ADMIN administers — survives the move to OIDC unchanged,
  # which is the point of defining roles by capability. The move itself is blocked on a Maven
  # dependency this offline build cannot fetch; see the plan's Track B.
  #
  # Until then: distinct credentials per surface, rotated on the group's schedule, and never
  # shared between environments. A staging credential that works in production is a staging
  # build that can write to the production ledger.
  denave-web: "REPLACE-FROM-SECRET-MANAGER"
  athena-dialer: "REPLACE-FROM-SECRET-MANAGER"
  compliance-console: "REPLACE-FROM-SECRET-MANAGER"
